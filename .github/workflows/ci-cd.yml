name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ─── Job 1: Lint ───────────────────────────────────────────
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
          npm install --save-dev @babel/eslint-parser @babel/preset-react

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install worker dependencies
        run: |
          cd worker
          pip install -r requirements.txt
          pip install flake8

      - name: Lint worker
        run: |
          cd worker
          flake8 worker.py --max-line-length=120 --ignore=E501,W503

  # ─── Job 2: Build & Push Docker Images ─────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          tags: |
            adityadev10311/ai-task-backend:latest
            adityadev10311/ai-task-backend:${{ steps.tag.outputs.TAG }}

      - name: Build & Push worker
        uses: docker/build-push-action@v4
        with:
          context: ./worker
          dockerfile: ./worker/Dockerfile
          push: true
          tags: |
            adityadev10311/ai-task-worker:latest
            adityadev10311/ai-task-worker:${{ steps.tag.outputs.TAG }}

      - name: Build & Push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            adityadev10311/ai-task-frontend:latest
            adityadev10311/ai-task-frontend:${{ steps.tag.outputs.TAG }}

  # ─── Job 3: Update Infra Repo ───────────────────────────────
  update-infra:
    name: Update Infra Repo
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v3
        with:
          repository: Adity322/ai-task-infra
          token: ${{ secrets.GH_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Update image tags in manifests
        run: |
          sed -i "s|adityadev10311/ai-task-backend:.*|adityadev10311/ai-task-backend:${{ steps.tag.outputs.TAG }}|g" backend/deployment.yaml
          sed -i "s|adityadev10311/ai-task-worker:.*|adityadev10311/ai-task-worker:${{ steps.tag.outputs.TAG }}|g" worker/deployment.yaml
          sed -i "s|adityadev10311/ai-task-frontend:.*|adityadev10311/ai-task-frontend:${{ steps.tag.outputs.TAG }}|g" frontend/deployment.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ steps.tag.outputs.TAG }}"
          git push
