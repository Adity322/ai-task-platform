name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ─── Job 1: Build & Push Docker Images ─────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          tags: |
            adityadev10311/ai-task-backend:latest
            adityadev10311/ai-task-backend:${{ steps.tag.outputs.TAG }}

      - name: Build & Push worker
        uses: docker/build-push-action@v4
        with:
          context: ./worker
          dockerfile: ./worker/Dockerfile
          push: true
          tags: |
            adityadev10311/ai-task-worker:latest
            adityadev10311/ai-task-worker:${{ steps.tag.outputs.TAG }}

      - name: Build & Push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            adityadev10311/ai-task-frontend:latest
            adityadev10311/ai-task-frontend:${{ steps.tag.outputs.TAG }}

  # ─── Job 2: Update Infra Repo ───────────────────────────────
  update-infra:
    name: Update Infra Repo
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v3
        with:
          repository: Adity322/ai-task-infra
          token: ${{ secrets.GH_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Update image tags in manifests
        run: |
          sed -i "s|adityadev10311/ai-task-backend:.*|adityadev10311/ai-task-backend:${{ steps.tag.outputs.TAG }}|g" backend/deployment.yaml
          sed -i "s|adityadev10311/ai-task-worker:.*|adityadev10311/ai-task-worker:${{ steps.tag.outputs.TAG }}|g" worker/deployment.yaml
          sed -i "s|adityadev10311/ai-task-frontend:.*|adityadev10311/ai-task-frontend:${{ steps.tag.outputs.TAG }}|g" frontend/deployment.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ steps.tag.outputs.TAG }}"
          git push
